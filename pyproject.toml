[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-research-toolkit"
version = "0.1.0"
description = "A modular toolkit for building and evaluating agentic research workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Farshad Aghasharif" }
]
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "typing-extensions>=4.10"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0",
  "mypy>=1.10"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
